<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Locket Gold Pro - Hoàng Nghĩa</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&family=Pacifico&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #F2C94C;
            --pink-neon: #FF007F;
            --pink-soft: #FFB6C1;
            --zalo: #0068FF;
            --bg-color: #0B0B0B;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); color: #fff; overflow-x: hidden; }

        /* --- MÀN HÌNH CHỜ TÌNH XẢO (INTRO) --- */
        #welcome-screen {
            position: fixed; inset: 0; z-index: 1000;
            display: flex; align-items: center; justify-content: center;
            background: #000; overflow: hidden;
            transition: all 1s cubic-bezier(0.7, 0, 0.3, 1);
        }

        /* Nền video/ảnh mờ ảo phía sau */
        .intro-bg {
            position: absolute; inset: 0;
            background: url('https://surprised-scarlet-ycf0c2mq1w.edgeone.app/IMG_3198.jpeg') no-repeat center center;
            background-size: cover; filter: blur(30px) brightness(0.3);
            transform: scale(1.2);
        }

        /* Thẻ trung tâm nhỏ gọn */
        .glass-card {
            position: relative; z-index: 1002;
            width: 340px; padding: 40px 20px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            animation: cardAppear 1.2s ease-out;
        }

        /* Viền sáng chạy quanh thẻ */
        .glass-card::after {
            content: ''; position: absolute; inset: -2px;
            border-radius: 42px; padding: 2px;
            background: linear-gradient(45deg, transparent, var(--pink-neon), var(--primary), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude;
            animation: rotateGradient 4s linear infinite;
        }

        .avatar-box {
            position: relative; width: 130px; height: 130px; margin: 0 auto 25px;
        }
        .avatar-box img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; box-shadow: 0 0 20px var(--pink-neon);
        }

        .welcome-name {
            font-size: 22px; font-weight: 900; letter-spacing: 4px;
            background: linear-gradient(to right, #fff, var(--pink-soft));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            margin-bottom: 30px; text-transform: uppercase;
        }

        .start-btn { 
            background: linear-gradient(45deg, var(--pink-neon), var(--primary));
            color: #fff; width: 100%; padding: 18px; border-radius: 25px;
            border: none; font-size: 14px; font-weight: 900; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            box-shadow: 0 10px 20px rgba(255, 0, 127, 0.3);
            transition: 0.4s;
        }

        /* --- HIỆU ỨNG HOA NỞ TỔNG LỰC --- */
        #flower-transition {
            position: absolute; top: 50%; left: 50%; width: 0; height: 0; 
            background: radial-gradient(circle, var(--pink-neon), var(--primary), #fff);
            border-radius: 50%; transform: translate(-50%, -50%);
            z-index: 1010; pointer-events: none; display: none;
        }
        .bloom-animation { display: block !important; animation: flower-bloom 1.5s cubic-bezier(0.7, 0, 0.3, 1) forwards; }

        @keyframes rotateGradient { to { transform: rotate(360deg); } }
        @keyframes cardAppear { from { opacity: 0; transform: translateY(30px) scale(0.9); } }
        @keyframes flower-bloom { 0% { width: 0; height: 0; } 100% { width: 400vmax; height: 400vmax; } }

        /* --- TRANG CHỦ (GIỮ NGUYÊN NỘI DUNG) --- */
        .container { max-width: 480px; margin: 0 auto; padding: 20px; position: relative; z-index: 10; color: #1d1d1f; }
        .main-bg { position: fixed; inset: 0; background: #fff; z-index: 1; }
        header { text-align: center; padding: 30px 0; position: relative; z-index: 10; }
        .author-logo { width: 70px; height: 70px; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.1); object-fit: cover; }
        .card { background: #fff; border-radius: 30px; padding: 25px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); position: relative; z-index: 10; }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 20px; background: #000; margin-bottom: 15px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
        .btn-zalo { background: var(--zalo); color: white; border-radius: 20px; text-decoration: none; display: block; padding: 18px; font-weight: 800; text-align: center; margin-top: 15px; }

        /* Hiệu ứng Yêu Em bay lên */
        .love-note {
            position: fixed; bottom: -100px; z-index: 9999; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
            animation: flyUp 4s ease-out forwards;
        }
        .love-note span { font-family: 'Pacifico', cursive; color: #fff; font-size: 26px; text-shadow: 0 0 15px var(--pink-neon); }

        @keyframes flyUp { 0% { transform: translateY(0) scale(0.5); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-130vh) scale(1.5); opacity: 0; } }
    </style>
</head>
<body>

    <div id="welcome-screen">
        <div class="intro-bg"></div>
        <div id="flower-transition"></div>
        
        <div class="glass-card" id="welcome-content">
            <div class="avatar-box">
                <img src="https://surprised-scarlet-ycf0c2mq1w.edgeone.app/IMG_3198.jpeg" alt="Hoàng Nghĩa">
            </div>
            <div class="welcome-name">Hoàng Nghĩa</div>
            <button class="start-btn" onclick="startApp()">Xem Hướng dẫn để có locket gold</button>
        </div>
    </div>

    <div class="main-bg"></div>
    <div id="heart-container"></div>

    <div class="container">
        <header>
            <img src="https://surprised-scarlet-ycf0c2mq1w.edgeone.app/IMG_3198.jpeg" class="author-logo">
            <h1 style="font-weight: 900; margin-top: 10px; font-size: 22px;">LOCKET <span style="color:var(--pink-neon)">GOLD</span> PRO</h1>
        </header>

        <div class="card">
            <h2 style="font-size: 18px; margin-bottom: 10px;">Hướng Dẫn Chi Tiết</h2>
            <div class="video-container">
                <iframe src="https://www.youtube.com/embed/aqf2I3TQ3fs" allowfullscreen></iframe>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 18px; margin-bottom: 10px;">Link Module</h2>
            <div style="background: #fdf2f8; padding: 15px; border-radius: 15px; border: 1px solid #ffb6c1; margin-bottom: 15px;">
                <div id="moduleUrl" style="font-family: monospace; font-size: 11px; word-break: break-all; color: #d63384;">https://raw.githubusercontent.com/vuong2023/shad/main/modules/Locket_ohb.sgmodule</div>
            </div>
            <button onclick="copyText()" style="width: 100%; padding: 18px; border-radius: 18px; background: #000; color: #fff; font-weight: 800; border: none; cursor: pointer;">SAO CHÉP LINK</button>
        </div>

        <div class="card" style="text-align: center;">
            <a href="https://zalo.me/0339283222" target="_blank" class="btn-zalo">CHAT QUA ZALO</a>
        </div>

        <footer style="text-align: center; font-size: 11px; color: #aaa; padding: 20px 0 40px;">© 2026 HOÀNG NGHĨA • PREMIUM</footer>
    </div>

    <audio id="myMusic" loop>
        <source src="Audios_20260512_0406.mp3" type="audio/mpeg">
    </audio>

    <script>
        function startApp() {
            const flower = document.getElementById('flower-transition');
            const screen = document.getElementById('welcome-screen');
            const music = document.getElementById('myMusic');
            const content = document.getElementById('welcome-content');

            content.style.transform = "scale(0.8)";
            content.style.opacity = "0";
            
            flower.classList.add('bloom-animation');
            music.play();

            // Hiệu ứng "Yêu Em"
            for(let i=0; i<15; i++) {
                setTimeout(createLoveNote, i * 200);
            }

            setTimeout(() => {
                screen.style.opacity = '0';
                setTimeout(() => screen.style.display = 'none', 1000);
            }, 1200);

            setInterval(createFallingHeart, 300);
        }

        function createLoveNote() {
            const note = document.createElement('div');
            note.className = 'love-note';
            note.innerHTML = `<span style="font-size: 40px;">💖</span><span>Yêu Em</span>`;
            note.style.left = Math.random() * 80 + 10 + 'vw';
            note.style.animationDuration = (Math.random() * 2 + 3) + 's';
            document.body.appendChild(note);
            setTimeout(() => note.remove(), 4000);
        }

        function createFallingHeart() {
            const container = document.getElementById('heart-container');
            const h = document.createElement('div');
            h.style.position = 'fixed'; h.style.top = '-20px'; h.style.zIndex = '5';
            h.innerHTML = '🌸';
            h.style.left = Math.random() * 100 + 'vw';
            h.style.animation = `fall ${Math.random()*3+3}s linear forwards`;
            container.appendChild(h);
            setTimeout(() => h.remove(), 5000);
        }

        function copyText() {
            const text = document.getElementById('moduleUrl').innerText;
            navigator.clipboard.writeText(text).then(() => alert('Đã copy!'));
        }
    </script>
    <style>
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); } }
    </style>
</body>
</html>
